<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Request — {{business_name}}</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#111827;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;padding:60px 20px;">
    <tr>
      <td align="center">

        <!-- Main Container -->
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">

          <!-- Header -->
          <tr>
            <td style="padding:40px 40px 24px 40px;text-align:center;">
              <img src="cid:flowpay_logo" alt="FlowPay" width="48" height="48" style="display:inline-block;border-radius:12px;margin-bottom:16px;" />
              <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-0.5px;color:#111827;">{{business_name}}</h1>
              <p style="margin:8px 0 0 0;font-size:14px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;font-weight:500;">Payment Request</p>
            </td>
          </tr>

          <!-- Amount display -->
          <tr>
            <td style="padding:0 40px 32px 40px;text-align:center;">
              <h2 style="margin:0;font-size:48px;font-weight:700;letter-spacing:-2px;color:#111827;">₹{{amount}}</h2>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <div style="height:1px;background-color:#f3f4f6;width:100%;"></div>
            </td>
          </tr>

          <!-- Details -->
          <tr>
            <td style="padding:32px 40px;">
              <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#374151;">
                Hi <strong style="color:#111827;">{{customer_name}}</strong>,<br><br>
                Here is your secure payment link for the invoice detailed below.
              </p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb;border-radius:8px;padding:20px;">
                <tr>
                  <td style="padding-bottom:12px;">
                    <span style="font-size:13px;color:#6b7280;display:block;margin-bottom:4px;">Description</span>
                    <span style="font-size:14px;color:#111827;font-weight:500;">{{description}}</span>
                  </td>
                </tr>
                <tr>
                  <td>
                    <span style="font-size:13px;color:#6b7280;display:block;margin-bottom:4px;">Due Date</span>
                    <span style="font-size:14px;color:#111827;font-weight:500;">{{due_date}}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td style="padding:0 40px 48px 40px;text-align:center;">
              <a href="{{payment_url}}" target="_blank" style="display:inline-block;background-color:#111827;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:16px 32px;border-radius:8px;letter-spacing:-0.2px;width:100%;box-sizing:border-box;">
                Complete Payment
              </a>
              <p style="margin:24px 0 0 0;font-size:12px;color:#9ca3af;line-height:1.5;">
                Or pay using this link:<br>
                <a href="{{payment_url}}" style="color:#4b5563;text-decoration:underline;word-break:break-all;">{{payment_url}}</a>
              </p>
            </td>
          </tr>

        </table>
        
        <!-- Footer outside card -->
        <table role="presentation" width="480" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:24px 0;text-align:center;">
              <p style="margin:0;font-size:12px;color:#9ca3af;font-weight:500;">
                Powered by ⚡️ FlowPay
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
