<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Receipt — {{business_name}}</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#111827;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff;padding:60px 20px;">
    <tr>
      <td align="center">

        <!-- Main Container -->
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">

          <!-- Header -->
          <tr>
            <td style="padding:40px 40px 24px 40px;text-align:center;">
              <div style="width:48px;height:48px;border-radius:24px;background-color:#059669;display:inline-block;margin-bottom:16px;line-height:48px;color:white;font-size:20px;">✓</div>
              <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-0.5px;color:#111827;">Payment Received</h1>
              <p style="margin:8px 0 0 0;font-size:14px;color:#6b7280;font-weight:500;">Thank you, {{customer_name}}</p>
            </td>
          </tr>

          <!-- Amount display -->
          <tr>
            <td style="padding:0 40px 32px 40px;text-align:center;">
              <h2 style="margin:0;font-size:48px;font-weight:700;letter-spacing:-2px;color:#059669;">₹{{amount_paid}}</h2>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <div style="height:1px;background-color:#f3f4f6;width:100%;"></div>
            </td>
          </tr>

          <!-- Details -->
          <tr>
            <td style="padding:32px 40px 48px 40px;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f9fafb;border-radius:8px;padding:20px;">
                <tr>
                  <td style="padding-bottom:12px;border-bottom:1px solid #e5e7eb;">
                    <span style="font-size:13px;color:#6b7280;display:block;margin-bottom:4px;">Business</span>
                    <span style="font-size:14px;color:#111827;font-weight:500;">{{business_name}}</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;">
                    <span style="font-size:13px;color:#6b7280;display:block;margin-bottom:4px;">Description</span>
                    <span style="font-size:14px;color:#111827;font-weight:500;">{{description}}</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding-top:12px;">
                    <span style="font-size:13px;color:#6b7280;display:block;margin-bottom:4px;">Date Paid</span>
                    <span style="font-size:14px;color:#111827;font-weight:500;">{{paid_at}}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        
        <!-- Footer outside card -->
        <table role="presentation" width="480" cellpadding="0" cellspacing="0">
          <tr>
            <td style="padding:24px 0;text-align:center;">
              <p style="margin:0;font-size:12px;color:#9ca3af;font-weight:500;">
                Powered by ⚡️ FlowPay<br>
                This email serves as your official receipt.
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
